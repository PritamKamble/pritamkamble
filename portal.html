<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal · Pritam Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1210; --surface:#151B18; --surface-2:#1B2320; --line:#2A332E;
    --ink:#EDEFEA; --muted:#8B9690; --muted-2:#5E6A64;
    --amber:#E8A33D; --green:#5FBF77; --rust:#D1614A;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.5;}
  .wrap{max-width:1000px; margin:0 auto; padding:24px;}
  a{color:inherit;}

  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
  .logo{font-family:var(--mono); font-weight:700; font-size:15px;}
  .logo span{color:var(--green);}
  .who{font-family:var(--mono); font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:12px;}
  .who .role-badge{background:var(--surface-2); color:var(--amber); padding:3px 9px; border-radius:5px; text-transform:uppercase; font-size:10.5px;}
  .logout{color:var(--muted-2); text-decoration:none; cursor:pointer;}

  .tabs{display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;}
  .tabbtn{background:var(--surface); border:1px solid var(--line); color:var(--muted); padding:9px 16px; border-radius:7px; font-family:var(--mono); font-size:12.5px; cursor:pointer;}
  .tabbtn.active{border-color:var(--green); color:var(--green);}

  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:22px; margin-bottom:16px;}
  .card h2{font-family:var(--mono); font-size:16px; margin-bottom:14px;}

  .field{margin-bottom:12px;}
  .field label{display:block; font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-bottom:5px; text-transform:uppercase;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:6px;
    padding:10px 12px; color:var(--ink); font-family:var(--sans); font-size:13.5px;
  }
  .field textarea{resize:vertical; min-height:80px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:600px){ .row2{grid-template-columns:1fr;} }

  .btn{background:var(--green); color:#0B140E; border:none; border-radius:6px; padding:10px 16px; font-family:var(--mono); font-weight:600; font-size:12.5px; cursor:pointer;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:8px 14px; font-family:var(--mono); font-size:12px; cursor:pointer;}
  .btn-sm{padding:5px 10px; font-size:11px;}

  .stats{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
  .stat{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 16px; min-width:100px;}
  .stat .n{font-family:var(--mono); font-size:20px; font-weight:700; color:var(--green);}
  .stat .l{font-size:11px; color:var(--muted); text-transform:uppercase;}

  .job{border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:10px;}
  .job h3{font-family:var(--mono); font-size:14.5px; margin-bottom:4px;}
  .job .meta{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .job p{font-size:13px; color:var(--muted); margin-bottom:10px;}
  .chip{display:inline-block; font-family:var(--mono); font-size:10.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); color:var(--amber); margin-right:6px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:8px; font-family:var(--mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; border-bottom:1px solid var(--line);}
  td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top;}
  select.status-sel{background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:5px; padding:4px 6px; font-family:var(--mono); font-size:11px;}
  .muted{color:var(--muted); font-size:12px;}
  .empty{color:var(--muted); font-family:var(--mono); font-size:13px; text-align:center; padding:24px;}
  .toast{font-family:var(--mono); font-size:12px; color:var(--green); margin-top:8px; display:none;}
  .gate{max-width:360px; margin:100px auto; text-align:center;}
</style>
</head>
<body>

<div class="wrap">
  <div id="loadingGate" class="gate"><p class="muted" style="font-family:var(--mono);">Loading...</p></div>

  <div id="app" style="display:none;">
    <header>
      <div class="logo">~/<span>pritam</span>.mentor</div>
      <div class="who">
        <span id="whoName"></span>
        <span class="role-badge" id="whoRole"></span>
        <a class="logout" id="logoutBtn">Log out</a>
      </div>
    </header>

    <!-- CANDIDATE VIEW -->
    <div id="candidateView">
      <div class="tabs">
        <div class="tabbtn active" data-panel="cProgress">My Progress</div>
        <div class="tabbtn" data-panel="cJobs">Job Listings</div>
        <div class="tabbtn" data-panel="cApplications">My Applications</div>
      </div>

      <div class="panel active" id="cProgress">
        <div class="card">
          <h2>Update your progress</h2>
          <form id="progressForm">
            <div class="row2">
              <div class="field">
                <label>Track</label>
                <select id="pTrack">
                  <option value="fullstack">Full-Stack</option>
                  <option value="genai">GenAI</option>
                  <option value="fullstack_genai">Full-Stack + GenAI</option>
                  <option value="cloud">Cloud/DevOps</option>
                </select>
              </div>
              <div class="field">
                <label>Level</label>
                <select id="pLevel">
                  <option value="beginner">Beginner</option>
                  <option value="some_experience">Some experience</option>
                  <option value="job_ready_prep">Job-ready prep</option>
                </select>
              </div>
            </div>
            <div class="row2">
              <div class="field">
                <label>Weeks completed</label>
                <input id="pWeeks" type="number" min="0" max="24" value="0" />
              </div>
              <div class="field">
                <label>DSA problems solved</label>
                <input id="pDsa" type="number" min="0" max="150" value="0" />
              </div>
            </div>
            <div class="row2">
              <div class="field">
                <label>Latest mock interview score (/10)</label>
                <input id="pMock" type="number" min="0" max="10" step="0.5" />
              </div>
              <div class="field">
                <label>Capstone status</label>
                <input id="pCapstone" type="text" placeholder="e.g. In progress, Live" />
              </div>
            </div>
            <div class="field">
              <label>Bio / notes</label>
              <textarea id="pBio" placeholder="Short intro for recruiters browsing candidates"></textarea>
            </div>
            <div class="field">
              <label>Resume URL</label>
              <input id="pResume" type="url" placeholder="https://..." />
            </div>
            <button class="btn" type="submit">Save progress</button>
            <div class="toast" id="progressToast">Saved ✓</div>
          </form>
        </div>
      </div>

      <div class="panel" id="cJobs">
        <div class="card">
          <h2>Open positions</h2>
          <div id="jobsList"><div class="empty">Loading jobs...</div></div>
        </div>
      </div>

      <div class="panel" id="cApplications">
        <div class="card">
          <h2>My applications</h2>
          <div id="myApplications"><div class="empty">Loading...</div></div>
        </div>
      </div>
    </div>

    <!-- HR VIEW -->
    <div id="hrView">
      <div class="tabs">
        <div class="tabbtn active" data-panel="hPost">Post a Job</div>
        <div class="tabbtn" data-panel="hJobs">My Jobs</div>
        <div class="tabbtn" data-panel="hCandidates">Browse Candidates</div>
      </div>

      <div class="panel active" id="hPost">
        <div class="card">
          <h2>Post a new job</h2>
          <form id="jobForm">
            <div class="row2">
              <div class="field">
                <label>Job title</label>
                <input id="jTitle" type="text" required />
              </div>
              <div class="field">
                <label>Company</label>
                <input id="jCompany" type="text" required />
              </div>
            </div>
            <div class="row2">
              <div class="field">
                <label>Location</label>
                <input id="jLocation" type="text" placeholder="Remote, Mumbai, etc." />
              </div>
              <div class="field">
                <label>Employment type</label>
                <select id="jType">
                  <option value="full_time">Full-time</option>
                  <option value="internship">Internship</option>
                  <option value="contract">Contract</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label>Description</label>
              <textarea id="jDesc" required placeholder="Role, requirements, how to stand out..."></textarea>
            </div>
            <button class="btn" type="submit">Post job</button>
            <div class="toast" id="jobToast">Posted ✓</div>
          </form>
        </div>
      </div>

      <div class="panel" id="hJobs">
        <div class="card">
          <h2>Jobs you've posted</h2>
          <div id="hrJobsList"><div class="empty">Loading...</div></div>
        </div>
      </div>

      <div class="panel" id="hCandidates">
        <div class="card">
          <h2>Candidate pool</h2>
          <div id="candidatesList"><div class="empty">Loading...</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SUPABASE_URL = 'https://qhcstjlyooxjekzggaqp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoY3N0amx5b294amVremdnYXFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2NTc1NzgsImV4cCI6MjA3NTIzMzU3OH0.vEq3uhm-o_Pfq7fLM1ArI70_zI08gi4lfBSTqP4-e7c';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let profile = null;

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session){ window.location.href = 'login.html'; return; }

    const { data: p, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if(error || !p){ window.location.href = 'login.html'; return; }
    profile = p;

    document.getElementById('loadingGate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('whoName').textContent = profile.full_name;
    document.getElementById('whoRole').textContent = profile.role;

    if(profile.role === 'candidate'){
      document.getElementById('candidateView').style.display = 'block';
      document.getElementById('hrView').style.display = 'none';
      loadMyProgress();
      loadOpenJobs();
      loadMyApplications();
    } else {
      document.getElementById('candidateView').style.display = 'none';
      document.getElementById('hrView').style.display = 'block';
      loadHrJobs();
      loadCandidates();
    }

    setupTabs();
  }

  function setupTabs(){
    document.querySelectorAll('.tabbtn').forEach(btn => {
      btn.addEventListener('click', function(){
        const container = this.closest('div').parentElement;
        container.querySelectorAll('.tabbtn').forEach(b => b.classList.remove('active'));
        container.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        document.getElementById(this.getAttribute('data-panel')).classList.add('active');
      });
    });
  }

  document.getElementById('logoutBtn').addEventListener('click', async function(){
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  // ---------- CANDIDATE ----------
  async function loadMyProgress(){
    const { data } = await sb.from('candidate_profiles').select('*').eq('user_id', profile.id).maybeSingle();
    if(data){
      document.getElementById('pTrack').value = data.track || 'fullstack_genai';
      document.getElementById('pLevel').value = data.level || 'beginner';
      document.getElementById('pWeeks').value = data.weeks_completed || 0;
      document.getElementById('pDsa').value = data.dsa_solved || 0;
      document.getElementById('pMock').value = data.mock_score || '';
      document.getElementById('pCapstone').value = data.capstone_status || '';
      document.getElementById('pBio').value = data.bio || '';
      document.getElementById('pResume').value = data.resume_url || '';
    }
  }

  document.getElementById('progressForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const payload = {
      user_id: profile.id,
      track: document.getElementById('pTrack').value,
      level: document.getElementById('pLevel').value,
      weeks_completed: parseInt(document.getElementById('pWeeks').value) || 0,
      dsa_solved: parseInt(document.getElementById('pDsa').value) || 0,
      mock_score: document.getElementById('pMock').value ? parseFloat(document.getElementById('pMock').value) : null,
      capstone_status: document.getElementById('pCapstone').value || null,
      bio: document.getElementById('pBio').value || null,
      resume_url: document.getElementById('pResume').value || null,
      updated_at: new Date().toISOString()
    };
    const { error } = await sb.from('candidate_profiles').upsert(payload);
    const toast = document.getElementById('progressToast');
    toast.style.display = 'block';
    toast.textContent = error ? ('Error: ' + error.message) : 'Saved ✓';
    setTimeout(() => toast.style.display = 'none', 2500);
  });

  async function loadOpenJobs(){
    const { data, error } = await sb.from('jobs').select('*').eq('status', 'open').order('created_at', { ascending: false });
    const el = document.getElementById('jobsList');
    if(error || !data || data.length === 0){ el.innerHTML = '<div class="empty">No open jobs right now.</div>'; return; }
    el.innerHTML = data.map(j => `
      <div class="job">
        <h3>${escapeHtml(j.title)} — ${escapeHtml(j.company)}</h3>
        <div class="meta">${escapeHtml(j.location || 'Location flexible')} · ${escapeHtml(j.employment_type)}</div>
        <p>${escapeHtml(j.description)}</p>
        <button class="btn btn-sm apply-btn" data-job="${j.id}">Apply</button>
      </div>
    `).join('');
    document.querySelectorAll('.apply-btn').forEach(btn => {
      btn.addEventListener('click', async function(){
        this.disabled = true; this.textContent = 'Applying...';
        const { error } = await sb.from('job_applications').insert({ job_id: this.getAttribute('data-job'), candidate_id: profile.id });
        this.textContent = error ? 'Already applied / error' : 'Applied ✓';
        loadMyApplications();
      });
    });
  }

  async function loadMyApplications(){
    const { data, error } = await sb.from('job_applications').select('*, jobs(title, company, status)').eq('candidate_id', profile.id).order('applied_at', { ascending: false });
    const el = document.getElementById('myApplications');
    if(error || !data || data.length === 0){ el.innerHTML = '<div class="empty">No applications yet.</div>'; return; }
    el.innerHTML = `<table><thead><tr><th>Job</th><th>Company</th><th>Status</th></tr></thead><tbody>` +
      data.map(a => `<tr><td>${escapeHtml(a.jobs?.title || '—')}</td><td>${escapeHtml(a.jobs?.company || '—')}</td><td>${escapeHtml(a.status)}</td></tr>`).join('') +
      `</tbody></table>`;
  }

  // ---------- HR ----------
  document.getElementById('jobForm')?.addEventListener('submit', async function(e){
    e.preventDefault();
    const payload = {
      hr_id: profile.id,
      title: document.getElementById('jTitle').value.trim(),
      company: document.getElementById('jCompany').value.trim(),
      location: document.getElementById('jLocation').value.trim() || null,
      employment_type: document.getElementById('jType').value,
      description: document.getElementById('jDesc').value.trim()
    };
    const { error } = await sb.from('jobs').insert(payload);
    const toast = document.getElementById('jobToast');
    toast.style.display = 'block';
    toast.textContent = error ? ('Error: ' + error.message) : 'Posted ✓';
    if(!error){ this.reset(); loadHrJobs(); }
    setTimeout(() => toast.style.display = 'none', 2500);
  });

  async function loadHrJobs(){
    const { data, error } = await sb.from('jobs').select('*, job_applications(id)').eq('hr_id', profile.id).order('created_at', { ascending: false });
    const el = document.getElementById('hrJobsList');
    if(error || !data || data.length === 0){ el.innerHTML = '<div class="empty">You haven\\'t posted any jobs yet.</div>'; return; }
    el.innerHTML = data.map(j => `
      <div class="job">
        <h3>${escapeHtml(j.title)} — ${escapeHtml(j.company)}</h3>
        <div class="meta">${escapeHtml(j.location || '')} · <span class="chip">${j.job_applications?.length || 0} applicants</span></div>
        <div id="apps-${j.id}"></div>
      </div>
    `).join('');
    data.forEach(j => loadJobApplications(j.id));
  }

  async function loadJobApplications(jobId){
    const { data, error } = await sb.from('job_applications').select('*, profiles(full_name, email)').eq('job_id', jobId);
    const el = document.getElementById('apps-' + jobId);
    if(!el) return;
    if(error || !data || data.length === 0){ el.innerHTML = '<div class="muted">No applicants yet.</div>'; return; }
    el.innerHTML = `<table><thead><tr><th>Candidate</th><th>Status</th></tr></thead><tbody>` +
      data.map(a => `
        <tr>
          <td>${escapeHtml(a.profiles?.full_name || '—')}<br><span class="muted">${escapeHtml(a.profiles?.email || '')}</span></td>
          <td>
            <select class="status-sel app-status" data-id="${a.id}">
              <option value="applied" ${a.status==='applied'?'selected':''}>Applied</option>
              <option value="shortlisted" ${a.status==='shortlisted'?'selected':''}>Shortlisted</option>
              <option value="rejected" ${a.status==='rejected'?'selected':''}>Rejected</option>
              <option value="hired" ${a.status==='hired'?'selected':''}>Hired</option>
            </select>
          </td>
        </tr>
      `).join('') + `</tbody></table>`;
    el.querySelectorAll('.app-status').forEach(sel => {
      sel.addEventListener('change', async function(){
        await sb.from('job_applications').update({ status: this.value }).eq('id', this.getAttribute('data-id'));
      });
    });
  }

  async function loadCandidates(){
    const { data, error } = await sb.from('candidate_profiles').select('*, profiles(full_name, email)').order('updated_at', { ascending: false });
    const el = document.getElementById('candidatesList');
    if(error || !data || data.length === 0){ el.innerHTML = '<div class="empty">No candidate profiles yet.</div>'; return; }
    el.innerHTML = `<table><thead><tr><th>Name</th><th>Track / Level</th><th>Progress</th><th>Mock</th><th>Resume</th></tr></thead><tbody>` +
      data.map(c => `
        <tr>
          <td>${escapeHtml(c.profiles?.full_name || '—')}<br><span class="muted">${escapeHtml(c.profiles?.email || '')}</span></td>
          <td>${escapeHtml(c.track || '—')}<br><span class="muted">${escapeHtml(c.level || '')}</span></td>
          <td>${c.weeks_completed || 0}/24 wks · ${c.dsa_solved || 0} DSA</td>
          <td>${c.mock_score != null ? c.mock_score + '/10' : '—'}</td>
          <td>${c.resume_url ? `<a href="${escapeHtml(c.resume_url)}" target="_blank" rel="noopener" style="color:var(--amber);">View →</a>` : '—'}</td>
        </tr>
      `).join('') + `</tbody></table>`;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  init();
})();
</script>

</body>
</html>
