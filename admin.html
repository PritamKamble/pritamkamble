<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin · Waitlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1210; --surface:#151B18; --surface-2:#1B2320; --line:#2A332E;
    --ink:#EDEFEA; --muted:#8B9690; --muted-2:#5E6A64;
    --amber:#E8A33D; --green:#5FBF77; --rust:#D1614A;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); padding:24px; line-height:1.5;}
  .wrap{max-width:1100px; margin:0 auto;}
  h1{font-family:var(--mono); font-size:20px; margin-bottom:6px;}
  .sub{color:var(--muted); font-size:13.5px; margin-bottom:24px;}

  .gate{max-width:360px; margin:80px auto; text-align:center;}
  .gate input{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:12px 14px; color:var(--ink); font-family:var(--mono); font-size:14px; margin-bottom:12px;
  }
  .gate input:focus{outline:none; border-color:var(--green);}
  .gate button, .btn{
    background:var(--green); color:#0B140E; border:none; border-radius:6px;
    padding:11px 18px; font-family:var(--mono); font-weight:600; font-size:13px;
    cursor:pointer; width:100%;
  }
  .err{color:var(--rust); font-family:var(--mono); font-size:12.5px; margin-top:10px; display:none;}

  .stats{display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px 18px; min-width:130px;}
  .stat .n{font-family:var(--mono); font-size:22px; font-weight:700; color:var(--green);}
  .stat .l{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}

  table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:13px;}
  th{background:var(--surface-2); text-align:left; padding:10px 12px; font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  td{padding:10px 12px; border-top:1px solid var(--line); vertical-align:top;}
  tr:hover td{background:var(--surface-2);}
  .name{font-weight:600;}
  .muted{color:var(--muted); font-size:12px;}
  .badge{font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:4px; background:var(--surface-2); color:var(--green); white-space:nowrap;}
  .ref-badge{color:var(--amber);}
  select.status{
    background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:5px;
    padding:5px 7px; font-family:var(--mono); font-size:11.5px;
  }
  .refresh{background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:8px 14px; font-family:var(--mono); font-size:12.5px; cursor:pointer; margin-bottom:16px;}
  .empty{color:var(--muted); text-align:center; padding:40px; font-family:var(--mono); font-size:13px;}
  a{color:var(--amber);}
  .wa-link{font-size:11.5px;}
  @media (max-width:800px){
    table, thead, tbody, th, td, tr{display:block;}
    thead{display:none;}
    tr{border:1px solid var(--line); border-radius:8px; margin-bottom:10px; padding:8px;}
    td{border:none; padding:4px 6px;}
    td:before{content:attr(data-label); display:block; font-family:var(--mono); font-size:10px; color:var(--muted-2); text-transform:uppercase;}
  }
</style>
</head>
<body>

<div id="gateView" class="gate">
  <h1 style="margin-bottom:16px;">Admin access</h1>
  <input id="passcodeInput" type="password" placeholder="Passcode" autocomplete="off" />
  <button id="unlockBtn">Unlock</button>
  <div class="err" id="gateErr">Wrong passcode.</div>
</div>

<div id="dashView" class="wrap" style="display:none;">
  <h1>Waitlist applicants</h1>
  <div class="sub">Sorted by referral count, then earliest applied.</div>
  <button class="refresh" id="refreshBtn">↻ Refresh</button>

  <div class="stats" id="stats"></div>

  <div id="tableWrap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SUPABASE_URL = 'https://qhcstjlyooxjekzggaqp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoY3N0amx5b294amVremdnYXFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2NTc1NzgsImV4cCI6MjA3NTIzMzU3OH0.vEq3uhm-o_Pfq7fLM1ArI70_zI08gi4lfBSTqP4-e7c';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const gateView = document.getElementById('gateView');
  const dashView = document.getElementById('dashView');
  const passInput = document.getElementById('passcodeInput');
  const gateErr = document.getElementById('gateErr');

  let passcode = sessionStorage.getItem('admin_pc') || '';

  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN', {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
  }

  async function loadData(){
    const { data, error } = await sb.rpc('admin_list_applicants', { p_passcode: passcode });
    if(error){
      sessionStorage.removeItem('admin_pc');
      gateView.style.display = 'block';
      dashView.style.display = 'none';
      gateErr.style.display = 'block';
      return;
    }
    gateView.style.display = 'none';
    dashView.style.display = 'block';
    render(data || []);
  }

  function render(rows){
    const total = rows.length;
    const referred = rows.filter(r => r.referred_by).length;
    const contacted = rows.filter(r => r.status !== 'waiting').length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="n">${total}</div><div class="l">Total applicants</div></div>
      <div class="stat"><div class="n">${referred}</div><div class="l">Via referral</div></div>
      <div class="stat"><div class="n">${contacted}</div><div class="l">Contacted+</div></div>
    `;

    if(total === 0){
      document.getElementById('tableWrap').innerHTML = '<div class="empty">No applicants yet.</div>';
      return;
    }

    const rowsHtml = rows.map(r => `
      <tr data-id="${r.id}">
        <td data-label="Name"><div class="name">${escapeHtml(r.name)}</div><div class="muted">${escapeHtml(r.college_or_company || '—')}</div></td>
        <td data-label="Contact">${escapeHtml(r.phone)}<br><a class="wa-link" href="https://wa.me/${r.phone.replace(/[^0-9]/g,'')}" target="_blank" rel="noopener">WhatsApp →</a></td>
        <td data-label="Track">${escapeHtml(r.track)}<br><span class="muted">${escapeHtml(r.level)}</span></td>
        <td data-label="Referrals">${r.referral_count > 0 ? `<span class="badge ref-badge">${r.referral_count} referred</span>` : '<span class="muted">—</span>'}${r.referred_by ? `<div class="muted" style="margin-top:4px;">via ${escapeHtml(r.referred_by)}</div>` : ''}</td>
        <td data-label="Verify">${r.phone_verified ? '<span class="badge" style="color:var(--green);">✓ verified</span>' : (r.verify_code ? `<span class="badge ref-badge">code: ${escapeHtml(r.verify_code)}</span>` : '<span class="muted">—</span>')}
          ${!r.phone_verified ? `<button class="btn btn-ghost verify-btn" data-id="${r.id}" style="padding:4px 8px; font-size:11px; margin-top:6px; width:auto;">Mark verified</button>` : ''}
        </td>
        <td data-label="Applied">${fmtDate(r.created_at)}</td>
        <td data-label="Status">
          <select class="status" data-id="${r.id}">
            <option value="waiting" ${r.status==='waiting'?'selected':''}>Waiting</option>
            <option value="contacted" ${r.status==='contacted'?'selected':''}>Contacted</option>
            <option value="enrolled" ${r.status==='enrolled'?'selected':''}>Enrolled</option>
            <option value="closed" ${r.status==='closed'?'selected':''}>Closed</option>
          </select>
        </td>
      </tr>
    `).join('');

    document.getElementById('tableWrap').innerHTML = `
      <table>
        <thead><tr><th>Name</th><th>Contact</th><th>Track / Level</th><th>Referrals</th><th>Verify</th><th>Applied</th><th>Status</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;

    document.querySelectorAll('select.status').forEach(sel => {
      sel.addEventListener('change', async function(){
        const id = this.getAttribute('data-id');
        const status = this.value;
        await sb.rpc('admin_update_status', { p_passcode: passcode, p_id: id, p_status: status });
      });
    });

    document.querySelectorAll('.verify-btn').forEach(btn => {
      btn.addEventListener('click', async function(){
        const id = this.getAttribute('data-id');
        this.textContent = '...';
        await sb.rpc('admin_set_verified', { p_passcode: passcode, p_id: id, p_verified: true });
        loadData();
      });
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  document.getElementById('unlockBtn').addEventListener('click', function(){
    passcode = passInput.value.trim();
    gateErr.style.display = 'none';
    sessionStorage.setItem('admin_pc', passcode);
    loadData();
  });
  passInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ document.getElementById('unlockBtn').click(); }
  });
  document.getElementById('refreshBtn').addEventListener('click', loadData);

  if(passcode){ loadData(); }
})();
</script>

</body>
</html>
