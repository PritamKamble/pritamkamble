<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Applicants</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0d10;
    color: #e6e8eb;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #8a8f98; font-size: 13px; margin-bottom: 28px; }

  #login {
    max-width: 360px;
    margin: 80px auto;
    background: #14171b;
    border: 1px solid #23262b;
    border-radius: 10px;
    padding: 28px;
  }
  #login h2 { margin: 0 0 16px; font-size: 16px; }
  #login input {
    width: 100%;
    padding: 10px 12px;
    background: #0b0d10;
    border: 1px solid #2a2e35;
    border-radius: 6px;
    color: #e6e8eb;
    font-size: 14px;
    margin-bottom: 12px;
  }
  #login button, .refresh-btn {
    width: 100%;
    padding: 10px 12px;
    background: #2fd97f;
    color: #06140c;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .refresh-btn { width: auto; padding: 8px 16px; }
  #login .err { color: #ff6b6b; font-size: 13px; margin-top: 8px; display: none; }
  #login .ok { color: #5cf5a0; font-size: 13px; margin-top: 8px; display: none; }
  #login .forgot { display: block; text-align: center; margin-top: 14px; font-size: 12px; color: #8a8f98; text-decoration: none; cursor: pointer; }
  #login .forgot:hover { color: #2fd97f; }
  #login .signout { text-align: center; margin-top: 10px; }

  #panel { display: none; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .toolbar-right { display: flex; gap: 8px; align-items: center; }
  .signout-btn { background: transparent; border: 1px solid #2a2e35; color: #8a8f98; padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .signout-btn:hover { color: #e6e8eb; border-color: #3a3e45; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat {
    background: #14171b;
    border: 1px solid #23262b;
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 120px;
  }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: #8a8f98; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #14171b; border: 1px solid #23262b; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #1e2227; white-space: nowrap; }
  th { color: #8a8f98; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #171b20; }
  .badge { padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.waiting { background: #3a2e14; color: #f5c451; }
  .badge.contacted { background: #14283a; color: #5cb3f5; }
  .badge.enrolled { background: #143a1e; color: #5cf5a0; }
  .badge.closed { background: #2a2a2a; color: #8a8f98; }
  .muted { color: #8a8f98; }
  .loading, .empty { text-align: center; padding: 40px; color: #8a8f98; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login">
    <h2>Admin login</h2>
    <input type="email" id="email" placeholder="Email" autocomplete="username" />
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" />
    <button onclick="login()">Sign in</button>
    <div class="err" id="err">Wrong email or password.</div>
    <div class="ok" id="ok">Check your email for a reset link.</div>
    <a class="forgot" id="forgotLink" onclick="forgotPassword()">Forgot password?</a>
  </div>

  <div id="panel">
    <div class="toolbar">
      <div>
        <h1>Applicants</h1>
        <div class="sub">Waitlist submissions, newest first</div>
      </div>
      <div class="toolbar-right">
        <button class="refresh-btn" onclick="load()">Refresh</button>
        <button class="signout-btn" onclick="signOut()">Sign out</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div style="overflow-x:auto">
      <table id="tbl" style="display:none">
        <thead>
          <tr>
            <th>Name</th><th>Phone</th><th>College / Company</th><th>Track</th><th>Level</th><th>Status</th><th>Referral code</th><th>Referred by</th><th>Applied</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="loading" id="state">Sign in to load applicants.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://qhcstjlyooxjekzggaqp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoY3N0amx5b294amVremdnYXFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2NTc1NzgsImV4cCI6MjA3NTIzMzU3OH0.vEq3uhm-o_Pfq7fLM1ArI70_zI08gi4lfBSTqP4-e7c";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // if already signed in (session persisted), skip straight to the panel
  client.auth.getSession().then(({ data }) => {
    if (data.session) {
      document.getElementById("login").style.display = "none";
      document.getElementById("panel").style.display = "block";
      load();
    }
  });

  async function login() {
    const email = document.getElementById("email").value.trim();
    const pw = document.getElementById("pw").value;
    const err = document.getElementById("err");
    const ok = document.getElementById("ok");
    err.style.display = "none";
    ok.style.display = "none";
    if (!email || !pw) return;

    const { error } = await client.auth.signInWithPassword({ email, password: pw });
    if (error) {
      err.textContent = error.message || "Wrong email or password.";
      err.style.display = "block";
      return;
    }
    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";
    load();
  }

  async function forgotPassword() {
    const email = document.getElementById("email").value.trim();
    const err = document.getElementById("err");
    const ok = document.getElementById("ok");
    err.style.display = "none";
    ok.style.display = "none";
    if (!email) {
      err.textContent = "Enter your email above first.";
      err.style.display = "block";
      return;
    }
    const { error } = await client.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href
    });
    if (error) {
      err.textContent = error.message;
      err.style.display = "block";
      return;
    }
    ok.style.display = "block";
  }

  async function signOut() {
    await client.auth.signOut();
    document.getElementById("panel").style.display = "none";
    document.getElementById("login").style.display = "block";
    document.getElementById("email").value = "";
    document.getElementById("pw").value = "";
  }

  document.getElementById("pw").addEventListener("keydown", (e) => {
    if (e.key === "Enter") login();
  });

  async function load() {
    const stateEl = document.getElementById("state");
    const tbl = document.getElementById("tbl");
    stateEl.style.display = "block";
    stateEl.textContent = "Loading…";
    tbl.style.display = "none";

    const { data, error } = await client
      .from("applicants")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      stateEl.textContent = "Couldn't load applicants: " + error.message;
      return;
    }

    render(data || []);
  }

  function render(rows) {
    const stateEl = document.getElementById("state");
    const tbl = document.getElementById("tbl");
    const tbody = document.getElementById("rows");
    const stats = document.getElementById("stats");

    if (!rows.length) {
      stateEl.textContent = "No applicants yet.";
      stateEl.style.display = "block";
      tbl.style.display = "none";
      stats.innerHTML = "";
      return;
    }

    const counts = rows.reduce((acc, r) => {
      acc[r.status] = (acc[r.status] || 0) + 1;
      return acc;
    }, {});
    stats.innerHTML = `
      <div class="stat"><div class="n">${rows.length}</div><div class="l">Total</div></div>
      <div class="stat"><div class="n">${counts.waiting || 0}</div><div class="l">Waiting</div></div>
      <div class="stat"><div class="n">${counts.contacted || 0}</div><div class="l">Contacted</div></div>
      <div class="stat"><div class="n">${counts.enrolled || 0}</div><div class="l">Enrolled</div></div>
    `;

    tbody.innerHTML = rows.map(r => `
      <tr>
        <td>${esc(r.name) || "—"}</td>
        <td>${esc(r.phone) || "—"}</td>
        <td>${esc(r.college_or_company) || "—"}</td>
        <td>${esc(r.track) || "—"}</td>
        <td>${esc(r.level) || "—"}</td>
        <td><span class="badge ${r.status}">${esc(r.status)}</span></td>
        <td class="muted">${esc(r.referral_code) || "—"}</td>
        <td class="muted">${esc(r.referred_by) || "—"}</td>
        <td class="muted">${fmtDate(r.created_at)}</td>
      </tr>
    `).join("");

    stateEl.style.display = "none";
    tbl.style.display = "table";
  }

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtDate(d) {
    if (!d) return "—";
    return new Date(d).toLocaleString();
  }
</script>
</body>
</html>
